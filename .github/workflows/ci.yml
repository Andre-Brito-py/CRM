name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      NPM_CONFIG_PRODUCTION: "false"
      PWA_DISABLE: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=shadow
      NEXTAUTH_SECRET: ci_dummy_secret
      NEXTAUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      OPENAI_API_KEY: sk-ci-dummy-key-not-used
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --include=dev

      - name: Validate Prisma & Lint
        run: |
          npx prisma validate
          npm run lint

      - name: Setup Database
        run: |
          npx prisma db push --accept-data-loss
          node scripts/seed-premium-user.js
          node scripts/seed-products.js

      - name: Build (Next.js)
        env:
          NODE_ENV: production
        run: npm run build

      - name: Run Tests
        env:
          NODE_ENV: test
        run: npx jest --no-coverage --verbose

      - name: Smoke (Next.js)
        env:
          NODE_ENV: production
        run: |
          npm start -- -p 3000 &
          PID=$!
          for i in {1..30}; do
            if curl -sSf http://localhost:3000/privacy >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sSf http://localhost:3000/privacy >/dev/null
          curl -sSf http://localhost:3000/terms >/dev/null
          curl -sSf http://localhost:3000/auth/login >/dev/null
          kill $PID
